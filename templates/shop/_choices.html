<fieldset>
  <legend class="mb-4 flex items-center gap-3">
    <span class="grid size-8 place-items-center rounded-full bg-stone-950 text-sm font-bold text-white dark:bg-white dark:text-stone-950">{{ step }}</span>
    <span class="text-xl font-bold">{{ field.label }}</span>
  </legend>
  <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
    {% for choice in field %}
      {% with ingredient=choice.data.value.instance %}
        <label class="relative flex items-center gap-3 rounded-2xl border-2 border-stone-200 p-4 transition has-checked:border-stone-950 {% if ingredient.is_sold_out %}cursor-not-allowed opacity-45{% else %}cursor-pointer hover:border-stone-400{% endif %} has-checked:bg-stone-50 has-focus-visible:ring-2 has-focus-visible:ring-accent dark:border-stone-700 dark:has-checked:border-white dark:has-checked:bg-stone-900">
          {{ choice.tag }}
          {% if ingredient %}
            <span class="size-9 shrink-0 rounded-full ring-1 ring-black/10" style="background: {{ ingredient.color }}"></span>
          {% endif %}
          <span class="flex-1">
            <span class="block font-semibold">{{ choice.choice_label }}</span>
            {% if ingredient.is_sold_out %}
              <span class="text-sm font-semibold text-red-700 dark:text-red-400">Ausverkauft</span>
            {% elif ingredient %}
              <span class="text-sm text-stone-500">+{{ ingredient.can_price|floatformat:2 }} €{% if ingredient.contains_caffeine %} · Koffein{% endif %}</span>
            {% endif %}
          </span>
          <span class="absolute right-3 top-3 hidden size-5 place-items-center rounded-full bg-stone-950 text-white peer-checked:grid dark:bg-white dark:text-stone-950" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="size-3" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>
          </span>
        </label>
      {% endwith %}
    {% endfor %}
  </div>
  {% for error in field.errors %}<p class="mt-2 text-sm text-red-600">{{ error }}</p>{% endfor %}
</fieldset>
