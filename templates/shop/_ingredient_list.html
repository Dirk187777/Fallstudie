<ul class="space-y-2">
  {% for ingredient in ingredients %}
    <li class="flex items-center gap-3">
      <span class="size-4 shrink-0 rounded-full ring-1 ring-black/10" style="background: {{ ingredient.color }}"></span>
      <span class="font-medium">{{ ingredient.name }}</span>
      <span class="text-sm text-stone-500">{{ ingredient.get_type_display }}</span>
    </li>
  {% endfor %}
</ul>
