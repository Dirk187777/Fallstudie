<div class="form-fields space-y-4">
  {% for error in form.non_field_errors %}
    <p class="rounded bg-red-100 p-2 text-sm text-red-800">{{ error }}</p>
  {% endfor %}
  {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="mb-1 block">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<p class="mt-1 text-sm text-stone-500">{{ field.help_text|safe }}</p>{% endif %}
      {% for error in field.errors %}<p class="text-sm text-red-600">{{ error }}</p>{% endfor %}
    </div>
  {% endfor %}
</div>
